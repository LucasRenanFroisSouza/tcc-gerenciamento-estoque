<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fornecedores</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="dashboard-layout">
    <button class="menu-toggle" id="menuToggle">☰</button>
    <header>
        <img src="../../static/images/logo_unesp.png" alt="UNESP">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="estoque.html" class="nav-link">Estoque (Lotes)</a>
        <a href="movimentacoes.html" class="nav-link">Movimentações</a>
        <a href="farmacos.html" class="nav-link">Fármacos</a>
        <a href="fornecedores.html" class="nav-link active-page">Fornecedores</a>
        <a href="index.html" class="sair">Sair</a>
    </header>
    <div class="content-wrapper">
        <main>
            <div class="page-header">
                <h1>Fornecedores</h1>
                <button class="btn btn-primary" onclick="openModal('modal-fornecedor')">+ Novo Fornecedor</button>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>CNPJ</th>
                            <th>Telefone</th>
                            <th>E-mail</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>

        <footer>Medicina Nuclear UNESP | Desemvolvido por SESI</footer>
    </div>
    <!-- Modal Fornecedor -->
    <div id="modal-fornecedor" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Novo Fornecedor</h3>
            <div class="input-group" style="margin-top: 15px;">
                <label>Nome / Razão Social</label>
                <input type="text" id="in-forn-nome" placeholder="Ex: Farmacêutica LTDA">
            </div>
            <div class="input-group">
                <label>CNPJ</label>
                <input type="text" id="in-forn-cnpj" placeholder="00.000.000/0000-00">
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex: 1;"><label>Telefone</label><input type="text" id="in-forn-tel"
                        placeholder="(00) 00000-0000"></div>
                <div class="input-group" style="flex: 1;"><label>E-mail</label><input type="email" id="in-forn-email"
                        placeholder="contato@fornecedor.com"></div>
            </div>
            <div style="text-align: right; margin-top: 20px;">
                <button class="btn btn-outline" onclick="closeModals()">Cancelar</button>
                <button class="btn btn-primary" id="btn-save-forn">Salvar Fornecedor</button>
            </div>
        </div>
    </div>

    <script>
        function openModal(modalId) {
            document.getElementById(modalId).classList.remove('hidden');
        }

        function closeModals() {
            const modals = document.querySelectorAll('.modal-overlay');
            modals.forEach(modal => modal.classList.add('hidden'));
        }

        // Fechar modal ao clicar fora dele
        window.onclick = function (event) {
            if (event.target.classList.contains('modal-overlay')) {
                closeModals();
            }
        }

        // Menu Mobile
        const menuToggle = document.getElementById('menuToggle');
        const header = document.querySelector('header');
        if (menuToggle && header) {
            menuToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                header.classList.toggle('open');
            });

            // Fecha o menu ao clicar fora dele no mobile
            document.addEventListener('click', (e) => {
                if (header.classList.contains('open') && !header.contains(e.target) && e.target !== menuToggle) {
                    header.classList.remove('open');
                }
            });
        }
    </script>
    <script src="/static/js/storage.js"></script>
    <script src="/static/js/fornecedores.js"></script>
</body>

</html>
